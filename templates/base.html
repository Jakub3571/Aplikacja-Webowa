{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block tytul %}Panel pracowniczy{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  {% if messages %}
    <div class="komunikaty">
      {% for komunikat in messages %}
        <div class="komunikat {{ komunikat.tags }}">{{ komunikat }}</div>
      {% endfor %}
    </div>
  {% endif %}

  {% block tresc %}{% endblock %}

  <footer class="stopka">
    <p href="https://example.com">@Jakub Ciszewski</p>
  </footer>
</body>
</html>
