{% load static %}
<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block tytul %}Panel pracowniczy{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ wersja_statycznych }}" />
        <link rel="icon" type="image/jpeg" href="{% static 'img/logo.jpg' %}?v={{ wersja_statycznych }}" />
        <link rel="apple-touch-icon" href="{% static 'img/logo.jpg' %}?v={{ wersja_statycznych }}" />
    </head>
	<body>
		{% if messages %}
		<div class="komunikaty">
			{% for komunikat in messages %}
			<div class="komunikat {{ komunikat.tags }}">{{ komunikat }}</div>
			{% endfor %}
		</div>
		{% endif %} {% block tresc %}{% endblock %} {% block skrypty %}{% endblock%}

		<script>
			(function () {
				function podepnijSzukanie(pole, tabela) {
					if (!pole || !tabela) return;
					pole.addEventListener('input', function () {
						var fraza = pole.value.trim().toLowerCase();
						tabela.querySelectorAll('tbody tr').forEach(function (wiersz) {
							var tekst = wiersz.textContent.toLowerCase();
							wiersz.style.display = tekst.indexOf(fraza) !== -1 ? '' : 'none';
						});
					});
				}

				document.querySelectorAll('.szukaj-tabela').forEach(function (pole) {
					podepnijSzukanie(pole, document.getElementById(pole.dataset.tabela));
				});

				document.querySelectorAll('table.tabela').forEach(function (tabela) {
					if (tabela.dataset.szukanie === 'wylaczone') return;
					var istniejace = document.querySelector(
						'.szukaj-tabela[data-tabela="' + (tabela.id || '') + '"]',
					);
					if (istniejace) return;
					var wrapper = tabela.closest('.tabela-wrapper') || tabela;
					var otoczka = document.createElement('div');
					otoczka.className = 'pole-szukania';
					otoczka.style.marginBottom = '1rem';
					var pole = document.createElement('input');
					pole.type = 'text';
					pole.placeholder = 'Szukaj na liście...';
					otoczka.appendChild(pole);
					wrapper.parentNode.insertBefore(otoczka, wrapper);
					podepnijSzukanie(pole, tabela);
				});
            })();

            // komunikaty znikają po 3 s (nie blokują zakładek)
            setTimeout(function () {
                var komunikaty = document.querySelector('.komunikaty');
                if (!komunikaty) return;
                komunikaty.style.transition = 'opacity 0.4s ease';
                komunikaty.style.opacity = '0';
                setTimeout(function () { komunikaty.style.display = 'none'; }, 400);
            }, 3000);
        </script>


		<footer class="stopka">
			<p href="https://example.com">@Jakub Ciszewski</p>
		</footer>
	</body>
</html>
